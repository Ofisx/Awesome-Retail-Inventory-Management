<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmer {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #ec4899; }
        100% { stop-color: #38bdf8; }
      }
      .scanner-beam {
        animation: scan 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .orbit-glow {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Modern Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="500" y1="0" x2="500" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1100" y1="0" x2="1100" y2="380" />
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
  </g>

  <!-- Glowing Ambient Circles -->
  <circle cx="200" cy="190" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="orbit-glow" />
  <circle cx="1020" cy="180" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="orbit-glow" />

  <!-- Left / Center Content -->
  <g transform="translate(80, 75)">
    <!-- Category Badge -->
    <rect x="400" y="0" width="250" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="432" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="400" y="80" fill="url(#neonGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Retail Inventory Management
    </text>

    <!-- Subtitle -->
    <text x="400" y="122" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      Curated Multi-Channel SaaS &amp; Open-Source Stock Control Platforms
    </text>

    <!-- Feature Pills -->
    <g transform="translate(400, 155)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" opacity="0.9" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📦 Multi-Warehouse</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.9" />
      <text x="194" y="22" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔄 Omnichannel Sync</text>

      <!-- Pill 3 -->
      <rect x="355" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.9" />
      <text x="370" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 Barcode &amp; BOM</text>

      <!-- Pill 4 -->
      <rect x="520" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.9" />
      <text x="535" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open-Source</text>
    </g>
  </g>

  <!-- Right Visual / Interactive Graphic: Barcode & Warehouse Hub -->
  <g transform="translate(860, 65)" class="floating-card">
    <!-- Hub Card Background -->
    <rect x="0" y="0" width="260" height="240" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#boxShadow)" />

    <!-- Terminal Header -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="42" cy="22" r="5" fill="#f59e0b" />
    <circle cx="60" cy="22" r="5" fill="#10b981" />
    <text x="80" y="26" fill="#64748b" font-family="monospace" font-size="11">inventory.control.hub</text>

    <!-- Barcode Visual Area -->
    <rect x="25" y="50" width="210" height="85" rx="8" fill="#1e293b" />
    
    <!-- Stylized Barcode Bars -->
    <g fill="#38bdf8" opacity="0.85">
      <rect x="40" y="60" width="4" height="65" />
      <rect x="48" y="60" width="8" height="65" />
      <rect x="60" y="60" width="3" height="65" />
      <rect x="67" y="60" width="6" height="65" />
      <rect x="77" y="60" width="10" height="65" />
      <rect x="91" y="60" width="4" height="65" />
      <rect x="99" y="60" width="7" height="65" />
      <rect x="110" y="60" width="3" height="65" />
      <rect x="117" y="60" width="9" height="65" />
      <rect x="130" y="60" width="5" height="65" />
      <rect x="139" y="60" width="7" height="65" />
      <rect x="150" y="60" width="4" height="65" />
      <rect x="158" y="60" width="10" height="65" />
      <rect x="172" y="60" width="3" height="65" />
      <rect x="179" y="60" width="8" height="65" />
      <rect x="191" y="60" width="5" height="65" />
      <rect x="200" y="60" width="8" height="65" />
      <rect x="212" y="60" width="4" height="65" />
    </g>

    <!-- Dynamic Scanning Laser Beam -->
    <g class="scanner-beam">
      <line x1="30" y1="52" x2="230" y2="52" stroke="#ec4899" stroke-width="2.5" filter="url(#glow)" />
      <rect x="30" y="47" width="200" height="12" fill="url(#laserGrad)" />
    </g>

    <!-- Metrics Row -->
    <g transform="translate(25, 150)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="98" height="65" rx="8" fill="#1e293b" />
      <text x="12" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ACCURACY</text>
      <text x="12" y="50" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">99.98%</text>

      <!-- Metric 2 -->
      <rect x="112" y="0" width="98" height="65" rx="8" fill="#1e293b" />
      <text x="124" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CHANNELS</text>
      <text x="124" y="50" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">SYNCED</text>
    </g>
  </g>
</svg>